baseURL = 'https://bmortgageservices.co.uk/'
languageCode = 'en-gb'
title = 'B Mortgage Services | Expert Mortgage & Insurance Advice'
theme = 'bms-theme'

[params]
  description = "Expert mortgage and insurance advice for individuals and employers. Access to a wide range of lenders."
  author = "B Mortgage Services"
  phone = "01452 925209"
  email = "info@bmortgagesolutions.co.uk"
  address = "39 Teddington Gardens, Gloucester, GL4 6RL"
  tagline = "We Make Your Mortgage Simple"
  brandOrange = "#F05B28"
  brandCharcoal = "#2D2D2D"
  # Openwork financial promotion sign-off date, e.g. "6 October 2026".
  # While empty the whole approval sentence is hidden rather than showing a
  # placeholder date. INPUT NEEDED: Q13
  financialPromotionApprovalDate = ""
  # Public Google review profile. While empty, the reviews component and the
  # "rated on Google" badge render nothing at all. INPUT NEEDED: Q6
  googleReviewUrl = ""

[params.social]
  facebook = "https://facebook.com/bmortgageservices"
  linkedin = "https://linkedin.com/company/bmortgageservices"
  instagram = "https://instagram.com/bmortgageservices"

